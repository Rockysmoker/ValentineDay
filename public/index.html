<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ola 💘 Will you be my valentine?</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="card">
    <svg class="bear" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="34" cy="30" r="10" fill="#fff" stroke="#111" stroke-width="4"/>
      <circle cx="86" cy="30" r="10" fill="#fff" stroke="#111" stroke-width="4"/>
      <circle cx="60" cy="46" r="28" fill="#fff" stroke="#111" stroke-width="4"/>
      <circle cx="50" cy="44" r="3" fill="#111"/>
      <circle cx="70" cy="44" r="3" fill="#111"/>
      <circle cx="42" cy="55" r="6" fill="#ff9bbb" opacity=".75"/>
      <circle cx="78" cy="55" r="6" fill="#ff9bbb" opacity=".75"/>
      <path d="M56 52c2 2 6 2 8 0" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 52v8" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 60c-4 0-7 2-9 4" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 60c4 0 7 2 9 4" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 78c6-10 34-10 40 0v18H40V78z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 96c-12-8-18-14-18-22 0-6 5-10 11-10 3 0 6 1 7 3 1-2 4-3 7-3 6 0 11 4 11 10 0 8-6 14-18 22z" fill="#ff4b8f" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    </svg>

    <h1>Ola will you be my valentine?</h1>

    <p class="srOnly" id="btnHelp">Wybierz odpowiedź: „No” ucieka przed kursorem.</p>
    <div class="btnArea" id="btnArea" aria-label="Buttons" aria-describedby="btnHelp">
      <button id="noBtn" type="button" aria-label="No">No</button>
      <button id="yesBtn" type="button" aria-label="Yes">Yes</button>
    </div>

    <div class="tiny">“No” seems a bit shy 😈</div>

    <div class="overlay" id="overlay" aria-live="polite">
      <div class="overlayBox" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="big">Yay! 💘</div>
        <p class="msg" id="overlayText">Ola, you’re officially my Valentine. ❤️</p>
        <p class="sub" id="overlayTitle">(Kliknij gdziekolwiek albo naciśnij Esc, żeby zamknąć)</p>
        <button class="closeBtn" type="button" id="closeOverlay">Zamknij</button>
      </div>
    </div>
  </main>

  <script src="assets/app.js" defer></script>
</body>
</html>
